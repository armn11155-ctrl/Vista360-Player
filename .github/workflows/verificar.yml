# Verificación automática de CADA push y cada Pull Request.
#
# Por qué existe: el 4 de agosto de 2026 un cambio pasó todas las
# comprobaciones locales y aun así rompió el despliegue de Cloudflare.
# El motivo fue que en la máquina donde se probó existían dependencias
# (functions/node_modules) que en un checkout limpio NO están, así que
# TypeScript resolvía un import que en el servidor no existía. El error
# solo apareció al desplegar, con la app ya publicada a medias.
#
# Este workflow reproduce el entorno del despliegue -- checkout limpio,
# `npm ci`, mismo Node -- y corre las mismas comprobaciones ANTES de que
# el cambio llegue a producción. Si algo se rompe, se sabe acá.
#
# Es a propósito independiente del despliegue de Cloudflare (que se
# dispara solo con el push): esto no impide el deploy, avisa. La marca
# de check verde/rojo queda visible en el commit y en el listado de
# Actions, que es donde se mira cuando algo sale mal.
name: ✅ Verificar (tipos, tests y build)

on:
  push:
    branches: [main]
  pull_request:
  # Para poder relanzarlo a mano sin tener que hacer un commit vacío.
  workflow_dispatch: {}

# Si se empujan dos commits seguidos, cancela la verificación del
# anterior: interesa el estado del último, no gastar minutos en uno ya
# reemplazado.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

# Solo lee el repo y publica el resumen del check -- ninguno de los tres
# jobs necesita tocar contenido, subir paquetes ni usar un secret (y
# menos aún los disparados por pull_request de un fork, que ya reciben
# un GITHUB_TOKEN de solo lectura de todos modos).
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (tipos + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Mismo Node que usa Cloudflare Pages (.node-version) para que
          # un fallo por versión aparezca acá y no en el despliegue.
          node-version-file: .node-version
          cache: npm

      # `npm ci` (no `npm install`) a propósito: instala EXACTAMENTE lo
      # que dice package-lock.json y falla si el lock está desalineado
      # con package.json -- que es justo lo que hace Cloudflare.
      - name: Instalar dependencias (limpio, igual que el despliegue)
        run: npm ci

      # OJO: acá NO se instala functions/node_modules, a propósito. Es
      # exactamente la diferencia que dejó pasar el fallo de agosto: si
      # algo dentro de src/ importa código del backend que arrastre sus
      # dependencias, este paso tiene que fallar.
      - name: Comprobar tipos del frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build

  backend:
    name: Cloud Functions (tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22" # el que declara functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias de functions
        working-directory: functions
        run: npm ci

      # Las Cloud Functions se despliegan a mano (workflow_dispatch), así
      # que sin esto un error de tipos del backend no se descubría hasta
      # el momento del despliegue -- con la persona esperando delante.
      - name: Comprobar tipos del backend
        working-directory: functions
        run: npx tsc --noEmit -p tsconfig.json

  reglas:
    name: Reglas de Firestore (ataques reales contra el emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm

      # El emulador de Firestore es un programa Java. Es la única razón
      # por la que estos tests no corren en la suite normal: exigir Java
      # instalado para lanzar `npm test` sería una molestia para
      # cualquiera que solo quiera tocar la interfaz.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Firebase CLI (trae el emulador)
        run: npm install -g firebase-tools

      # `emulators:exec` levanta el emulador, corre el comando y lo apaga
      # solo -- si el comando falla, el job falla. Se usa un proyecto
      # inventado (demo-) para que el emulador no toque NADA real: no
      # pide credenciales y nunca se conecta al proyecto de producción.
      - name: Atacar las reglas contra el emulador
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-vista360-reglas \
            "npm run test:reglas"

  recordatorio-deploy:
    # Este job NUNCA falla a propósito (todos sus pasos son informativos).
    # Existe por un riesgo real y ya documentado en OPERACION-PRODUCCION.md:
    # Cloudflare despliega el frontend solo con el push, pero las Cloud
    # Functions, los índices y las reglas de Firestore se despliegan a
    # mano (workflow_dispatch). Un push puede quedar "todo verde" en este
    # mismo workflow y aun así dejar producción a medias si el commit
    # tocaba el backend y nadie disparó el otro despliegue. Esto no lo
    # arregla -- solo hace que sea imposible no darse cuenta.
    name: 🔔 Recordatorio de despliegue manual
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Comprobar si este push toca backend/reglas/índices
        run: |
          ANTES="${{ github.event.before }}"
          # En un push nuevo a una rama (o el primer push del repo) "before"
          # puede venir en ceros o no tener historial de 2 commits todavía;
          # en ese caso no se puede diffear con seguridad, así que se avisa
          # igual en vez de asumir que no cambió nada.
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ANTES" 2>/dev/null; then
            CAMBIOS="(no se pudo calcular el diff exacto -- revisar a mano si corresponde)"
          else
            CAMBIOS=$(git diff --name-only "$ANTES" "${{ github.sha }}" -- functions/src firestore.rules firestore.indexes.json || true)
          fi

          if [ -n "$CAMBIOS" ]; then
            {
              echo "## 🔔 Este push toca backend, reglas o índices"
              echo ""
              echo "Archivos:"
              echo '```'
              echo "$CAMBIOS"
              echo '```'
              echo ""
              echo "El frontend ya se despliega solo (Cloudflare Pages), pero **esto no**:"
              echo "hace falta lanzar a mano el workflow *🔑 Configurar Secrets de R2 y"
              echo "Desplegar Functions* (marcar la casilla \`desplegar_reglas\` si el"
              echo "cambio incluye \`firestore.rules\`). Ver \`docs/OPERACION-PRODUCCION.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Este push no toca functions/src, firestore.rules ni firestore.indexes.json -- nada que recordar." >> "$GITHUB_STEP_SUMMARY"
          fi
