name: 🔑 Configurar Secrets de R2 y Desplegar Functions

on:
  workflow_dispatch:
    inputs:
      desplegar_reglas:
        description: "Publicar TAMBIÉN las reglas de seguridad de Firestore (¡leer docs/REGLAS-SEGURIDAD.md antes de la primera vez!)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  secrets-and-deploy:
    name: Configurar los 4 secrets de R2 y desplegar las Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar google-auth-library y @aws-sdk/client-s3 (para los scripts directos)
        run: |
          cd scripts
          npm init -y
          npm install google-auth-library @aws-sdk/client-s3

      - name: Configurar secrets (R2 + CRON_SYNC_SECRET + Resend) por API directa de Secret Manager
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAL_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          VAL_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          VAL_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VAL_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VAL_CRON_SYNC_SECRET: ${{ secrets.CRON_SYNC_SECRET }}
          VAL_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/set-r2-secrets-direct.mjs

      # Deja que el navegador lea (GET) objetos de R2 directo con
      # fetch(), sobre una URL YA FIRMADA (la misma que usan los
      # botones Ver/Descargar) -- así "Compartir por WhatsApp/correo"
      # en Reporte y Factura arma el archivo ahí mismo en el navegador,
      # sin pasar por ninguna Cloud Function (que dependía de que el
      # deploy grande de abajo saliera bien, y venía fallando). Ver
      # comentario largo en scripts/set-r2-cors.mjs.
      #
      # "continue-on-error: true" A PROPOSITO: el token de R2 que ya
      # existe como secret fue creado con permiso de "Object Read &
      # Write" (para leer/escribir archivos), no "Admin Read & Write"
      # (que hace falta para cambiar la CONFIGURACION del bucket, como
      # CORS) -- falla con AccessDenied (403). En la primera corrida
      # con este paso, al no tener este flag, ESE FALLO ABORTO TODO EL
      # JOB: ni siquiera se llegó a desplegar ninguna Cloud Function,
      # el mismo problema (un paso que puede fallar por permisos tumba
      # TODO el resto) que ya se había resuelto para los pasos de abajo
      # con "set +e"/"|| true". Con continue-on-error, si este paso
      # falla, el resto del workflow sigue igual -- CORS se puede dejar
      # configurado a mano una sola vez desde el dashboard de
      # Cloudflare mientras tanto (ver instrucciones que se le pasaron
      # al usuario).
      - name: Configurar CORS del bucket R2 (fetch directo del navegador)
        continue-on-error: true
        env:
          VAL_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          VAL_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          VAL_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VAL_R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          node scripts/set-r2-cors.mjs > /tmp/set-r2-cors-out.txt 2>&1
          echo "exit_code=$?" >> /tmp/set-r2-cors-out.txt
          cat /tmp/set-r2-cors-out.txt
          true

      - name: Guardar credencial de servicio en archivo (para el deploy de abajo)
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Instalar y compilar functions
        run: |
          cd functions
          npm ci
          npm run build

      # sincronizarEstadoPaneles vivia deployada como funcion SCHEDULED
      # (Cloud Scheduler) de una version vieja, antes de pasar a ser
      # HTTPS + cron de GitHub Actions (ver sincronizar-paneles-diario.yml
      # y el comentario largo en functions/src/sincronizarEstadoPaneles.ts).
      # Firebase NO deja cambiar el tipo de trigger de una funcion ya
      # deployada in-place -- el deploy de abajo viene fallando con
      # "Changing from a scheduled function to an HTTPS function is not
      # allowed" en CADA corrida desde ese cambio, y como esta en el
      # mismo --only que un monton de otras funciones (incluida
      # obtenerArchivoR2Base64), ese error tumbaba el batch ENTERO --
      # ninguna de esas funciones se llegaba a actualizar de verdad,
      # aunque el workflow se corriera. Se borra la version vieja acá
      # (con set +e / || true: si ya no existe como scheduled, o ya se
      # borro en una corrida anterior, no debe frenar el resto) para que
      # el deploy de mas abajo la vuelva a crear de cero, ya como HTTPS.
      - name: Borrar sincronizarEstadoPaneles vieja (era scheduled, cambio a HTTPS)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          set +e
          firebase functions:delete sincronizarEstadoPaneles \
            --project base-de-datos-vista360 --region us-central1 --force \
            > /tmp/delete-sync-out.txt 2>&1
          echo "exit_code=$?" >> /tmp/delete-sync-out.txt
          cat /tmp/delete-sync-out.txt

      # ORDEN IMPORTANTE: los índices ANTES que las funciones.
      #
      # crearContrato/actualizarContrato consultan los contratos
      # filtrando por panel Y por fecha, y esa combinación necesita un
      # índice compuesto (ver firestore.indexes.json). Si el código
      # llegara antes que el índice, Firestore rechazaría la consulta y
      # crear campañas fallaría hasta que el índice terminara de
      # construirse -- que en una colección grande puede tardar un buen
      # rato. Desplegándolos primero, ese hueco no existe.
      #
      # Aun así el código trae un respaldo: si el índice no está
      # disponible, la consulta se rehace sin el filtro de fecha (lee de
      # más, va algo más lento, pero NO se rompe). Este paso es para que
      # ese respaldo no haga falta casi nunca; el respaldo es para que,
      # si algún día hace falta, nadie se quede sin poder trabajar.
      #
      # `firebase deploy --only firestore:indexes` es idempotente: los
      # índices que ya existen se saltan, solo crea los que faltan. No
      # frena el resto si falla (set +e) -- peor que un índice sin crear
      # sería no desplegar las funciones (y el código tiene respaldo).
      #
      # ATENCION: acá NO va --force, a diferencia del resto de pasos.
      # Con --force, la CLI BORRA los índices que existan en el proyecto
      # y no estén en firestore.indexes.json (está en su código:
      # `shouldDeleteIndexes = options.force`). Este proyecto tiene
      # índices creados por otras vías -- el de informesCliente lo crea
      # scripts/create-informes-index-direct.mjs -- y también puede
      # haberlos hechos a mano desde la consola. Con --force, este paso
      # los habría borrado y habría roto pantallas que hoy funcionan,
      # como la lista de Reportes.
      #
      # Sin --force y con --non-interactive, la CLI responde que NO a la
      # pregunta de borrar (su `guard()` devuelve el default, que es
      # false), avisa por consola de los que sobran y sigue creando los
      # que faltan. O sea: crea, nunca borra. Es el comportamiento que
      # se quiere para un despliegue automático.
      # LAS REGLAS NO SE PUBLICAN SOLAS: hay que marcar la casilla al
      # lanzar el workflow. Es deliberado y no es exceso de precaución.
      #
      # Las reglas de Firestore son de todo o nada y tienen efecto
      # inmediato: si una queda mal, TODOS los clientes dejan de ver sus
      # datos al instante, sin necesidad de que nadie recargue nada. Es
      # el único cambio de este repositorio capaz de tumbar la app entera
      # sin tocar una línea de código.
      #
      # Y a diferencia del resto, no se pueden verificar desde el CI: no
      # existe forma de compilarlas ni probarlas sin credenciales del
      # proyecto real. Lo que sí hay es el simulador de la consola de
      # Firebase, que es donde deben probarse ANTES de marcar esta
      # casilla la primera vez. El procedimiento está en
      # docs/REGLAS-SEGURIDAD.md.
      #
      # Por eso: el resto del despliegue corre siempre; esto solo cuando
      # se pide a propósito.
      - name: Desplegar reglas de seguridad (solo si se marcó la casilla)
        if: ${{ inputs.desplegar_reglas }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          # SE ANOTA EL FALLO, PERO NO SE CORTA AQUI.
          #
          # Historia de este paso, que merece la pena:
          #
          #  1. Llevaba `set +e` y solo escribia el codigo de salida en un
          #     fichero. Las reglas fallaban, el workflow salia en VERDE,
          #     y la app corria con las reglas viejas -- sin acceso a los
          #     agregados, cayendo a los respaldos, sin ahorro y sin un
          #     solo aviso. Costo un dia entero de diagnostico.
          #
          #  2. Se puso a cortar el despliegue en seco. Peor: el fallo
          #     real es un 403 de firebaserules.googleapis.com (la cuenta
          #     de servicio NO tiene el rol para publicar reglas), asi
          #     que cortaba ANTES de desplegar las Cloud Functions -- que
          #     no tienen nada que ver y si son criticas.
          #
          # Lo correcto es: seguir desplegando todo lo demas, y marcar la
          # ejecucion en ROJO al final. Se entera igual, pero no se queda
          # sin funciones por un permiso de otra cosa.
          # `|| codigo=$?` NO ES UN ADORNO. GitHub Actions ejecuta cada
          # bloque con `bash -e`: sin eso, el fallo del comando mata el
          # script AHI MISMO y nunca se llega al `if` de abajo -- que es
          # exactamente lo que paso en la ejecucion del 5 de agosto,
          # dejando otra vez las Cloud Functions sin desplegar.
          #
          # Un comando a la izquierda de `||` esta exento de `-e`, asi
          # que asi se captura el codigo sin que el script muera. Se
          # evita la tuberia a `tee` a proposito: con pipe habria que
          # depender de PIPESTATUS, que es mas fragil.
          codigo=0
          firebase deploy --project base-de-datos-vista360 --non-interactive \
            --only firestore:rules > /tmp/deploy-rules.txt 2>&1 || codigo=$?
          cat /tmp/deploy-rules.txt
          echo "exit_code=$codigo" >> /tmp/deploy-rules.txt
          if [ "$codigo" -ne 0 ]; then
            echo "fallo" > /tmp/reglas-fallaron
            echo "::error::No se pudieron publicar las reglas de Firestore (codigo $codigo). El resto del despliegue continua; la ejecucion terminara en rojo."
            if grep -q "403" /tmp/deploy-rules.txt; then
              echo "::error::Es un 403: la cuenta de servicio no tiene permiso para publicar reglas. Dale el rol 'Firebase Rules Admin' (roles/firebaserules.admin) en Google Cloud > IAM, o publicalas a mano desde la consola de Firebase."
            fi
          fi

      # Comprobacion independiente: que lo publicado sea de verdad lo del
      # repositorio. `firebase deploy` puede terminar en 0 y aun asi
      # dejar algo distinto de lo esperado (un despliegue parcial, un
      # proyecto equivocado). Se descarga lo que hay vivo y se compara.
      - name: Verificar que las reglas publicadas son las del repositorio
        if: ${{ inputs.desplegar_reglas }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          # HACE FALTA ESTA, y su ausencia costo dos ejecuciones en rojo.
          # descargar-reglas-firestore.mjs lee FIREBASE_SERVICE_ACCOUNT
          # (no el fichero de GOOGLE_APPLICATION_CREDENTIALS). Sin ella
          # reventaba en el JSON.parse, el grep no encontraba nada, y este
          # paso declaraba "las reglas NO estan publicadas" aunque el
          # despliegue hubiera ido perfecto. Un verificador roto que acusa
          # a otro es peor que no tener verificador.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # `grep` devuelve 1 cuando NO encuentra. Con `bash -e` eso
          # mataria el paso en vez de anotar el fallo, asi que las
          # condiciones van con `if`, que exime del `-e`.
          node scripts/descargar-reglas-firestore.mjs > /tmp/reglas-vivas.txt 2>&1 || true
          cat /tmp/reglas-vivas.txt

          # PRIMERO: distinguir "no pude mirar" de "esta mal".
          # Si el propio verificador no consiguio descargar las reglas, NO
          # puede afirmar que esten mal. Se avisa y se deja el veredicto
          # anterior en paz.
          if ! grep -q "REGLAS ACTUALES EN PRODUCCION\|REGLAS ACTUALES EN PRODUCCIÓN" /tmp/reglas-vivas.txt; then
            echo "::warning::No se pudieron DESCARGAR las reglas para verificarlas. No significa que esten mal: revisa el log de arriba."
            exit 0
          fi

          # Marcadores que solo existen en las reglas nuevas. Comprueba lo
          # que hay VIVO, sin importar como llego ahi: si se publicaron a
          # mano desde la consola de Firebase, esto lo da por bueno igual.
          if ! grep -q "esPersonalDePortal" /tmp/reglas-vivas.txt; then
            echo "fallo" > /tmp/reglas-fallaron
            echo "::error::Las reglas vivas NO contienen esPersonalDePortal: lo publicado no es lo del repositorio."
          elif ! grep -q "match /agregados/" /tmp/reglas-vivas.txt; then
            echo "fallo" > /tmp/reglas-fallaron
            echo "::error::Las reglas vivas NO tienen el bloque de agregados. La app no podra leer los resumenes."
          else
            echo "OK: las reglas vivas incluyen el bloque de agregados y esPersonalDePortal."
            rm -f /tmp/reglas-fallaron
          fi

      - name: Desplegar índices de Firestore (antes que las functions)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          set +e
          firebase deploy --project base-de-datos-vista360 --non-interactive \
            --only firestore:indexes \
            > /tmp/deploy-indexes.txt 2>&1
          echo "exit_code=$?" >> /tmp/deploy-indexes.txt
          cat /tmp/deploy-indexes.txt

      - name: Desplegar 1 function sola (crea el bucket interno sin competencia)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          set +e
          firebase deploy --project base-de-datos-vista360 --non-interactive --force \
            --only functions:generarReporteCliente,functions:listarReportesCliente,functions:eliminarReporteCliente \
            > /tmp/deploy-out-1.txt 2>&1
          cat /tmp/deploy-out-1.txt

      - name: Desplegar el resto de las Cloud Functions (callables normales)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          set +e
          firebase deploy --project base-de-datos-vista360 --non-interactive --force \
            --only functions:enviarCorreoConPdf,functions:administrarRecordatorioDominio,functions:crearSubidaR2,functions:subirAvatarServidor,functions:obtenerEspacioR2,functions:administrarClienteAdmin,functions:actualizarAvatarPropio,functions:actualizarNombrePropio,functions:firmarUrlsR2,functions:registrarAcceso,functions:registrarVisita,functions:listarAccesosClientes,functions:crearClienteAcceso,functions:crearTrabajadorAcceso,functions:listarSolicitudesAccion,functions:listarPersonalInterno,functions:actualizarAvatarCliente,functions:actualizarImagenCampania,functions:comprimirFacturaPdf,functions:administrarUsuarioPortal,functions:crearClienteNuevo,functions:crearPanel,functions:eliminarPanel,functions:crearContrato,functions:eliminarContrato,functions:resolverSolicitudAccion,functions:eliminarSolicitudCampana,functions:crearSolicitudCampana,functions:sincronizarEstadoPanelesAhora,functions:limpiarArchivosHuerfanos,functions:resumenOcupacion,functions:contarEvidenciasHuerfanas,functions:crearFacturaAdmin,functions:firmarDescargaFactura,functions:actualizarPanel,functions:actualizarContrato,functions:diagnosticoPanel,functions:actualizarClienteInfo,functions:actualizarNombreFactura,functions:eliminarFactura,functions:marcarReporteVisto,functions:obtenerArchivoR2Base64,functions:restablecerPasswordCliente,functions:confirmarActivacionPush,functions:guardarTokenPush,functions:administrarCotizaciones,functions:actualizarEstadoSolicitud \
            > /tmp/deploy-out-2.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/deploy-out-2.txt
          cat /tmp/deploy-out-1.txt /tmp/deploy-out-2.txt > /tmp/deploy-out.txt

      # sincronizarEstadoPaneles va SOLA, en su propio paso con set +e,
      # porque su conversion de scheduled -> HTTPS sigue fallando (la
      # cuenta de servicio no tiene permiso IAM "cloudscheduler.jobs.delete"
      # para borrar el Cloud Scheduler job viejo que quedo asociado, asi que
      # el paso de "Borrar sincronizarEstadoPaneles vieja" de arriba no
      # logra completar la baja). Antes esta funcion iba mezclada en el
      # --only grande de arriba junto a ~40 funciones mas (firmarUrlsR2,
      # crearSubidaR2, obtenerEspacioR2, etc.) -- Firebase valida TODO el
      # lote antes de desplegar, asi que este UNICO conflicto tumbaba el
      # deploy de esas ~40 funciones enteras, en CADA corrida, sin que
      # ninguna se actualizara de verdad. Aislada aca, su fallo ya no
      # afecta a nada mas. Requiere un paso manual (borrar a mano el
      # Cloud Scheduler job o la funcion vieja desde la consola de Google
      # Cloud) para quedar resuelta del todo -- ver instrucciones.
      - name: Desplegar sincronizarEstadoPaneles sola (puede fallar sin frenar el resto)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          set +e
          firebase deploy --project base-de-datos-vista360 --non-interactive --force \
            --only functions:sincronizarEstadoPaneles \
            > /tmp/deploy-sync-alone-out.txt 2>&1
          cat /tmp/deploy-sync-alone-out.txt

      # sincronizarEstadoPaneles tiene invoker:"public" en su propia
      # definicion (para que el cron de GitHub Actions la pueda llamar
      # sin credenciales de Google) -- pero aplicar eso de verdad
      # requiere modificar la politica de IAM del servicio de Cloud Run
      # que hay detras, y Firebase CLI intenta hacerlo por un camino
      # que esta cuenta de servicio no puede usar (mismo tipo de error
      # que con Cloud Scheduler). Este paso hace ese mismo cambio por
      # la API de Cloud Run directo, que si funciona (igual que
      # set-r2-secrets-direct.mjs con Secret Manager). "|| true" para
      # que un fallo aca no frene el resto del workflow.
      - name: Otorgar invoker publico a sincronizarEstadoPaneles (API directa de Cloud Run)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/set-cloud-run-invoker-direct.mjs || true

      # Estas 2 son tareas programadas. Los cuatro avisos que antes
      # dependían de triggers de Firestore se movieron a las callables que
      # ya guardan cada operación (crearFacturaAdmin,
      # crearSolicitudCampana, actualizarEstadoSolicitud y
      # generarReporteCliente): Eventarc no tiene permisos en este proyecto
      # y esos triggers nunca llegaron a existir en producción.
      #
      # sincronizarEstadoPaneles YA NO esta aca -- dejo de ser
      # onSchedule (Cloud Scheduler, el mismo problema de IAM) y paso a
      # ser una funcion HTTPS normal con secret, llamada por el cron de
      # GitHub Actions en sincronizar-paneles-diario.yml. Se movio de
      # vuelta al paso de arriba, junto a las demas callables.
      # OJO: este paso tolera fallos a proposito (esas funciones dependen
      # de permisos de IAM que esta cuenta no siempre tiene). Eso
      # significa que pueden quedarse SIN DESPLEGAR y el workflow salir
      # en verde.
      #
      # Por eso las dos onSchedule dejan un "latido" en agregados/tareas
      # cada vez que corren, y el frontend avisa si alguna lleva mas de
      # dos dias sin latir (ver useTareasPeriodicas.ts). Sin eso, una
      # funcion de avisos podia quedarse meses sin desplegar --y sin que
      # nadie recibiera avisos-- sin ninguna senal.
      - name: Desplegar funciones con trigger (scheduler / Firestore) -- puede fallar sin frenar el resto
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          set +e
          firebase deploy --project base-de-datos-vista360 --non-interactive --force \
            --only functions:recordatorioVencimientoCampanas,functions:recordatorioReportesMensuales \
            > /tmp/deploy-out-3.txt 2>&1
          cat /tmp/deploy-out-3.txt
          cat /tmp/deploy-out-1.txt /tmp/deploy-out-2.txt /tmp/deploy-sync-alone-out.txt /tmp/deploy-out-3.txt > /tmp/deploy-out.txt

      # AHORA SI: si se pidio publicar las reglas y no se pudo, la
      # ejecucion termina en ROJO. Va al final, cuando las Cloud
      # Functions ya se desplegaron: un permiso que falta para las reglas
      # no puede dejar la aplicacion sin funciones.
      - name: Marcar en rojo si las reglas no se publicaron
        if: ${{ always() && inputs.desplegar_reglas }}
        run: |
          if [ -f /tmp/reglas-fallaron ]; then
            echo "::error::Las reglas de seguridad NO estan publicadas. Todo lo demas si se desplego."
            echo "Como arreglarlo, cualquiera de las dos:"
            echo "  a) Google Cloud > IAM > la cuenta de servicio del despliegue > anadir el rol 'Firebase Rules Admin' (roles/firebaserules.admin)."
            echo "  b) A mano: copiar firestore.rules del repositorio y pegarlo en Firebase > Firestore > Reglas > Publicar."
            exit 1
          fi
          echo "Reglas publicadas y verificadas."

      # LIMPIEZA DE IMAGENES DE CONTENEDOR (ahorro de coste real)
      #
      # Cloud Functions v2 no se despliega "tal cual": Google CONSTRUYE una
      # imagen de contenedor por cada funcion y cada despliegue, y la guarda
      # en Artifact Registry. Esas imagenes NO se borran solas, se acumulan,
      # y se cobran por almacenamiento aunque nadie las use nunca mas.
      #
      # Ese es el origen del cargo "Non-Firebase Services" en la factura:
      # no es uso de la aplicacion, es basura de despliegues antiguos.
      #
      # setpolicy le dice a Artifact Registry que borre las imagenes con mas
      # de N dias. Se conservan los ultimos dias para poder revertir a una
      # version anterior si un despliegue sale mal; lo viejo se va solo.
      #
      # Va con `set +e` a proposito: si este paso fallara (permisos, API sin
      # habilitar, cambio de nombre del comando en firebase-tools) NO debe
      # tumbar un despliegue que ya termino bien. Es limpieza, no despliegue.
      - name: Programar borrado automatico de imagenes de contenedor viejas
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          # NO SE PISA UNA POLITICA QUE YA EXISTA.
          #
          # El log del 5 de agosto mostro: "This will update an existing
          # policy that currently deletes images older than 1 days", y
          # despues "Failed to set up artifact registry cleanup policy".
          #
          # O sea que YA habia una politica, y de 1 dia -- mas agresiva
          # (y por tanto mas barata) que los 3 dias que pedia este paso.
          # Sobrescribirla habria sido un retroceso. Asi que si ya hay
          # una, se deja en paz y se dice cual es.
          set +e
          firebase functions:artifacts:setpolicy \
            --project base-de-datos-vista360 \
            --non-interactive --days 3 \
            > /tmp/limpieza-artifacts.txt 2>&1
          codigo=$?
          cat /tmp/limpieza-artifacts.txt
          existente=$(grep -oE "currently deletes images older than [0-9]+ days" /tmp/limpieza-artifacts.txt | head -1)
          if [ -n "$existente" ]; then
            echo "OK: ya hay una politica de limpieza ($existente). No se toca."
          elif [ "$codigo" -ne 0 ]; then
            echo "::warning::No se pudo programar el borrado de imagenes de contenedor. Las imagenes viejas seguiran ocupando (y cobrando) hasta que se configure a mano."
          else
            echo "OK: politica de limpieza programada a 3 dias."
          fi

      # Los diagnósticos se suben como ARTEFACTO de la ejecución, no
      # empujando una rama al repositorio.
      #
      # Antes esto hacía `git push origin HEAD:debug-deploy-functions`, y
      # eso empuja el árbol ENTERO, no solo los archivos de diagnóstico.
      # En cuanto el commit desplegado incluye algún cambio dentro de
      # .github/workflows/, GitHub rechaza el push:
      #
      #   refusing to allow a GitHub App to create or update workflow
      #   ... without `workflows` permission
      #
      # No es algo que se arregle dando permisos: el token de Actions
      # tiene prohibido por seguridad modificar workflows, y no existe un
      # permiso que se lo conceda. O sea que CUALQUIER despliegue hecho
      # desde un commit que toque este archivo fallaba en este paso.
      #
      # Y como el paso corre con `if: always()`, su fallo marcaba en rojo
      # toda la ejecución aunque las Cloud Functions se hubieran
      # desplegado perfectamente -- lo peor de los dos mundos: asusta sin
      # motivo y esconde si el deploy de verdad fue bien.
      #
      # Un artefacto no necesita permisos de escritura, no puede ser
      # rechazado, no deja commits basura en el repositorio y se descarga
      # desde la propia página de la ejecución.
      - name: Guardar diagnóstico como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: diagnostico-deploy-functions
          # Todos los archivos que van dejando los pasos de arriba. Se
          # listan uno a uno (y no con un comodín) para que, si alguien
          # agrega un paso nuevo con su propio log, se note que hay que
          # añadirlo acá en vez de perderlo en silencio.
          path: |
            /tmp/deploy-indexes.txt
            /tmp/deploy-rules.txt
            /tmp/deploy-out.txt
            /tmp/deploy-out-1.txt
            /tmp/deploy-out-2.txt
            /tmp/deploy-out-3.txt
            /tmp/deploy-sync-alone-out.txt
            /tmp/delete-sync-out.txt
            /tmp/set-r2-cors-out.txt
          retention-days: 14
          if-no-files-found: ignore
