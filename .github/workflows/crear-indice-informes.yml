name: 🔎 Crear índice de Reportes (informesCliente)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  crear-indice:
    name: Crear índice compuesto para la lista de reportes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Instalar dependencias del script
        run: |
          cd scripts
          npm install google-auth-library --no-save

      - name: Crear índice
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set +e
          node scripts/create-informes-index-direct.mjs > /tmp/index-out.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/index-out.txt

      # Como artefacto de la ejecución, no empujando una rama al
      # repositorio -- mismo motivo que en setup-r2-secrets-and-deploy.yml:
      # un push directo se rechaza en cuanto el commit desplegado toca
      # .github/workflows/ (el token de Actions no puede modificar
      # workflows, sin excepción), y como este paso corría con
      # `if: always()`, ese fallo pintaba de rojo toda la ejecución
      # aunque el índice se hubiera creado bien. Un artefacto no necesita
      # permiso de escritura sobre el repositorio y no puede ser
      # rechazado por eso -- por lo mismo, `permissions: contents: read`
      # de arriba ya alcanza para todo este workflow.
      - name: Guardar resultado como artefacto
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: crear-indice-informes-resultado
          path: /tmp/index-out.txt
          retention-days: 14
          if-no-files-found: warn
