<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a12" />
    <title>Vista360</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #050a12; }
      body { color: #dce6f5; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #estado { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <main id="estado" role="status" aria-live="polite">Abriendo el documento…</main>
    <script>
      (() => {
        const estado = document.getElementById("estado");
        const token = new URLSearchParams(location.search).get("token") || "";
        const clave = "vista360:visor-pdf:" + token;
        let datos = null;

        try {
          const guardado = sessionStorage.getItem(clave);
          sessionStorage.removeItem(clave);
          if (guardado) datos = JSON.parse(guardado);
        } catch (_) {
          datos = null;
        }

        const mostrarError = () => {
          estado.textContent = "No se pudo abrir el documento. Cierra esta pestaña y vuelve a intentarlo.";
        };

        if (!datos || typeof datos.url !== "string" || !datos.url) {
          mostrarError();
          return;
        }

        document.title = String(datos.nombre || "Documento").replace(/\.pdf$/i, "");
        const corte = new AbortController();
        const reloj = setTimeout(() => corte.abort(), 20_000);

        fetch(datos.url, { signal: corte.signal })
          .then((respuesta) => {
            if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
            return respuesta.blob();
          })
          .then((blob) => {
            const urlLocal = URL.createObjectURL(
              blob.type ? blob : new Blob([blob], { type: "application/pdf" }),
            );
            // Safari deja el visor incrustado gris aunque el Blob sea un PDF
            // válido. Navegar al blob entrega el archivo al visor PDF
            // nativo sin revelar la URL firmada de R2.
            location.replace(urlLocal);
          })
          .catch(mostrarError)
          .finally(() => clearTimeout(reloj));

        addEventListener("pagehide", () => {
          corte.abort();
          clearTimeout(reloj);
        }, { once: true });
      })();
    </script>
  </body>
</html>
