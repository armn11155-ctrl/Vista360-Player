<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a12" />
    <title>Vista360</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #050a12; }
      body { color: #dce6f5; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #estado { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; padding: 24px; background: #050a12; text-align: center; }
      #visor { display: block; width: 100%; height: 100%; border: 0; background: #8a8a8a; }
      .listo { display: none !important; }
    </style>
  </head>
  <body>
    <main id="estado" role="status" aria-live="polite">Abriendo el documento…</main>
    <iframe id="visor" title="Reporte Vista360 Player"></iframe>
    <script>
      (() => {
        const estado = document.getElementById("estado");
        const clave = "vista360:visor-pdf";
        const visor = document.getElementById("visor");
        let datos = null;
        let urlLocal = "";

        try {
          const guardado = sessionStorage.getItem(clave);
          sessionStorage.removeItem(clave);
          if (guardado) datos = JSON.parse(guardado);
        } catch (_) {
          datos = null;
        }

        const mostrarError = () => {
          estado.textContent = "No se pudo abrir el documento. Cierra esta pestaña y vuelve a intentarlo.";
        };

        if (!datos || typeof datos.url !== "string" || !datos.url) {
          mostrarError();
          return;
        }

        document.title = String(datos.nombre || "Documento").replace(/\.pdf$/i, "");
        // La pestaña sigue ejecutando este visor mínimo, pero la barra queda
        // limpia: únicamente el dominio de Vista360 Player, sin firmas,
        // tokens ni identificadores blob que se puedan copiar o reenviar.
        history.replaceState(null, "", "/");
        const corte = new AbortController();
        const reloj = setTimeout(() => corte.abort(), 20_000);

        fetch(datos.url, { signal: corte.signal })
          .then((respuesta) => {
            if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
            return respuesta.blob();
          })
          .then((blob) => {
            urlLocal = URL.createObjectURL(
              blob.type ? blob : new Blob([blob], { type: "application/pdf" }),
            );
            visor.src = urlLocal;
            estado.classList.add("listo");
          })
          .catch(mostrarError)
          .finally(() => clearTimeout(reloj));

        addEventListener("pagehide", () => {
          corte.abort();
          clearTimeout(reloj);
          if (urlLocal) URL.revokeObjectURL(urlLocal);
        }, { once: true });
      })();
    </script>
  </body>
</html>
