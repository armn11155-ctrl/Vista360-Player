<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: le dice al navegador que
         redimensione el area de contenido cuando aparece el teclado
         en pantalla, en vez de superponerlo sin avisar. Se agrega
         como intento de arreglar el bug conocido de iOS 18+ donde,
         en PWAs instaladas (display:standalone) como esta, el input
         recibe el foco pero el teclado nunca aparece (WebKit bug
         #279904, sin resolver del lado de Apple). No hay garantia de
         que esto lo arregle -- es la mitigacion recomendada para este
         caso puntual (layout fijo con overflow:hidden), pero el bug
         de fondo sigue siendo de iOS, no de esta app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <!-- Estilo critico del arranque: pinta la misma cortina azul de la app
         antes de que cargue React, para que no haya una pantalla negra ni
         una segunda aparición del logotipo.
         Va aqui como bloque de estilo, y NO como atributo en las
         etiquetas html/body, a proposito: la CSP permite este bloque por
         su hash, mientras que un atributo de estilo solo se podria
         permitir con 'unsafe-hashes' o 'unsafe-inline' (los hashes NO
         cubren atributos). Ponerlo aqui da el mismo resultado visual sin
         relajar la politica.
         Si editas este bloque, corre `node scripts/hashes-csp.mjs` y
         actualiza public/_headers (hay una prueba que lo verifica). -->
    <style>
      html{color-scheme:dark}
      html,body,#root{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#071D48}
      .v360-boot{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 18% 42%,rgba(78,148,246,.24),transparent 48%),linear-gradient(112deg,#06152D 0%,#0A3476 52%,#071D48 100%);animation:v360BootEnter .32s cubic-bezier(.72,0,.18,1) both}
      .v360-boot:after{content:"";position:absolute;inset:0;background:linear-gradient(102deg,transparent 30%,rgba(164,207,255,.14) 48%,transparent 66%);animation:v360BootSweep 1.55s ease-in-out infinite}
      @keyframes v360BootEnter{from{transform:translate3d(-105%,0,0)}to{transform:translate3d(0,0,0)}}
      @keyframes v360BootSweep{0%,16%{transform:translate3d(-55%,0,0);opacity:0}42%{opacity:.8}78%,100%{transform:translate3d(55%,0,0);opacity:0}}
      @media(prefers-reduced-motion:reduce){.v360-boot,.v360-boot:after{animation:none}}
    </style>

    <meta name="theme-color" content="#071D48" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vista360 Player" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />

    <!-- OpenStreetMap sirve las imagenes del mapa de Cobertura (Leaflet
         en si ya no viene de un CDN externo, se empaqueta con la app). -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />

    <!-- Firebase (login y datos): adelantar el DNS/TLS mientras el JS
         todavia esta cargando, para que el primer login o la primera
         lectura de datos no paguen esa espera aparte. Estos dominios
         son siempre los mismos sin importar el proyecto (el ID del
         proyecto va en la URL, no en el dominio). -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- El permiso de notificaciones pertenece al ORIGEN exacto. Safari
         puede tener vista360player.pe en "Permitir" y el dominio técnico
         de Cloudflare en "No permitir". Este script bloqueante redirige el
         dominio técnico antes de arrancar React/Firebase, para que sesión,
         Service Worker y campana vivan siempre en el dominio oficial. -->
    <link rel="canonical" href="https://vista360player.pe/" />
    <script src="/canonical-host.js"></script>

    <title>Vista360 Player</title>
  </head>
  <body>
    <div id="root">
      <div class="v360-boot" role="status" aria-label="Iniciando Vista360 Player"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
