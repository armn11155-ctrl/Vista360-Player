<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: le dice al navegador que
         redimensione el area de contenido cuando aparece el teclado
         en pantalla, en vez de superponerlo sin avisar. Se agrega
         como intento de arreglar el bug conocido de iOS 18+ donde,
         en PWAs instaladas (display:standalone) como esta, el input
         recibe el foco pero el teclado nunca aparece (WebKit bug
         #279904, sin resolver del lado de Apple). No hay garantia de
         que esto lo arregle -- es la mitigacion recomendada para este
         caso puntual (layout fijo con overflow:hidden), pero el bug
         de fondo sigue siendo de iOS, no de esta app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <!-- Estilo critico del arranque: pinta el fondo oscuro antes de que
         cargue el CSS de la app, para que no haya un destello blanco.
         Va aqui como bloque de estilo, y NO como atributo en las
         etiquetas html/body, a proposito: la CSP permite este bloque por
         su hash, mientras que un atributo de estilo solo se podria
         permitir con 'unsafe-hashes' o 'unsafe-inline' (los hashes NO
         cubren atributos). Ponerlo aqui da el mismo resultado visual sin
         relajar la politica.
         Si editas este bloque, corre `node scripts/hashes-csp.mjs` y
         actualiza public/_headers (hay una prueba que lo verifica). -->
    <style>
      html{color-scheme:dark}
      html,body,#root{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#050A12}
      .v360-boot{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#01040B;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .v360-boot:before{content:"";position:absolute;width:min(560px,92vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(8,119,255,.13),rgba(8,119,255,.025) 44%,transparent 70%)}
      .v360-boot-inner{position:relative;display:grid;justify-items:center;gap:16px;transform:translateY(-18px)}
      .v360-boot img{display:block;width:min(300px,72vw);height:auto;opacity:.92;animation:v360BootPulse 1.45s ease-in-out infinite}
      .v360-boot-line{width:min(180px,44vw);height:2px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.10)}
      .v360-boot-line:after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0877FF,#8CC4FF);animation:v360BootProgress 1.05s ease-in-out infinite}
      @keyframes v360BootPulse{50%{opacity:1;transform:translateY(-2px)}}
      @keyframes v360BootProgress{from{transform:translateX(-115%)}to{transform:translateX(340%)}}
      @media(prefers-reduced-motion:reduce){.v360-boot img,.v360-boot-line:after{animation:none}.v360-boot-line:after{width:100%;opacity:.72}}
    </style>

    <meta name="theme-color" content="#050A12" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vista360 Player" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />

    <!-- OpenStreetMap sirve las imagenes del mapa de Cobertura (Leaflet
         en si ya no viene de un CDN externo, se empaqueta con la app). -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />

    <!-- Firebase (login y datos): adelantar el DNS/TLS mientras el JS
         todavia esta cargando, para que el primer login o la primera
         lectura de datos no paguen esa espera aparte. Estos dominios
         son siempre los mismos sin importar el proyecto (el ID del
         proyecto va en la URL, no en el dominio). -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- El permiso de notificaciones pertenece al ORIGEN exacto. Safari
         puede tener vista360player.pe en "Permitir" y el dominio técnico
         de Cloudflare en "No permitir". Este script bloqueante redirige el
         dominio técnico antes de arrancar React/Firebase, para que sesión,
         Service Worker y campana vivan siempre en el dominio oficial. -->
    <link rel="canonical" href="https://vista360player.pe/" />
    <script src="/canonical-host.js"></script>

    <title>Vista360 Player</title>
  </head>
  <body>
    <div id="root">
      <div class="v360-boot" role="status" aria-label="Iniciando Vista360 Player">
        <div class="v360-boot-inner">
          <img src="/logo-player.webp" alt="" />
          <span class="v360-boot-line" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
