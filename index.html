<!DOCTYPE html>
<html lang="es" style="background:#050A12;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: le dice al navegador que
         redimensione el area de contenido cuando aparece el teclado
         en pantalla, en vez de superponerlo sin avisar. Se agrega
         como intento de arreglar el bug conocido de iOS 18+ donde,
         en PWAs instaladas (display:standalone) como esta, el input
         recibe el foco pero el teclado nunca aparece (WebKit bug
         #279904, sin resolver del lado de Apple). No hay garantia de
         que esto lo arregle -- es la mitigacion recomendada para este
         caso puntual (layout fijo con overflow:hidden), pero el bug
         de fondo sigue siendo de iOS, no de esta app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,body,#root{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#050A12}
    </style>

    <meta name="theme-color" content="#050A12" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vista360 Player" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />

    <!-- OpenStreetMap sirve las imagenes del mapa de Cobertura (Leaflet
         en si ya no viene de un CDN externo, se empaqueta con la app). -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />

    <!-- Firebase (login y datos): adelantar el DNS/TLS mientras el JS
         todavia esta cargando, para que el primer login o la primera
         lectura de datos no paguen esa espera aparte. Estos dominios
         son siempre los mismos sin importar el proyecto (el ID del
         proyecto va en la URL, no en el dominio). -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <title>Vista360 Player</title>
  </head>
  <body style="background:#050A12;margin:0;overflow:hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
